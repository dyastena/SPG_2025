<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dynamic Pricing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nico+Moji&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/litepicker@2.0.12/dist/litepicker.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litepicker@2.0.12/dist/nocss/litepicker.css">

    <style>
        /* All your common styles are here */
        body { font-family: 'Inter', sans-serif; }
        .font-nico-moji { font-family: 'Nico Moji', sans-serif; }
        .app-bg { background-color: #0F172A; }
        .sidebar-bg { background-color: #1E293B; }
        .content-bg { background-image: radial-gradient(at top, #1E293B, #0F172A); }
        .btn-nav.active { background-color: #2563EB; color: white; }
        /* Modal styles */
        #modal { transition: top 0.3s ease-out, opacity 0.3s ease-out; opacity: 0; top: 45%; }
        #modal.active { opacity: 1; top: 50%; }
        #modal-backdrop { opacity: 0; transition: opacity 0.3s ease-out; }
        #modal-backdrop.active { opacity: 1; }
        /* Cancel button style */
        .btn-cancel-edit { display: none; }
        /* Litepicker styles */
        .litepicker { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 0.75rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05); z-index: 100; color: #1f2937; }
        .litepicker .container__months .month-item-header { background-color: #f9fafb; color: #111827; }
        .litepicker .month-item-header .button-previous-month, .litepicker .month-item-header .button-next-month { color: #374151; }
        .litepicker .month-item-header .button-previous-month:hover, .litepicker .month-item-header .button-next-month:hover { background-color: #f3f4f6; }
        .litepicker .day-item { color: #374151; }
        .litepicker .day-item:hover { background-color: #f3f4f6; border-radius: 0.375rem; }
        .litepicker .day-item.is-today { color: #2563EB; font-weight: 600; }
        .litepicker .day-item.is-in-range { background-color: #dbeafe; color: #1e40af; border-radius: 0; }
        .litepicker .day-item.is-start-date { background-color: #2563EB; color: #ffffff; border-radius: 0.375rem 0 0 0.375rem; }
        .litepicker .day-item.is-end-date { background-color: #2563EB; color: #ffffff; border-radius: 0 0.375rem 0.375rem 0; }
        .litepicker .button-apply, .litepicker .button-cancel { color: #2563EB; font-weight: 600; }
        .litepicker .button-apply:hover, .litepicker .button-cancel:hover { background-color: #f3f4f6; }
    </style>
</head>
<body class="app-bg h-full antialiased text-gray-200 flex">

    <div 
      class="absolute top-0 left-0 w-full h-20 z-10" 
      style="background: linear-gradient(90.06deg, #4D5A68 -59.82%, #1E1E1E 49.37%, #4D5A68 159.63%);"
    ></div>

    <svg width="0" height="0" class="hidden">
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" id="icon-chevron-left">
            <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 010 1.06L9.06 10l3.73 3.71a.75.75 0 11-1.06 1.06l-4.25-4.25a.75.75 0 010-1.06l4.25-4.25a.75.75 0 011.06 0z" clip-rule="evenodd" />
        </symbol>
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" id="icon-pencil">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
        </symbol>
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" id="icon-trash">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 009 2zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
        </symbol>
        <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" id="icon-calendar">
            <path fill-rule="evenodd" d="M5.75 2a.75.75 0 01.75.75V4h7V2.75a.75.75 0 011.5 0V4h.25A2.75 2.75 0 0118 6.75v8.5A2.75 2.75 0 0115.25 18H4.75A2.75 2.75 0 012 15.25v-8.5A2.75 2.75 0 014.75 4H5V2.75A.75.75 0 015.75 2zM4.5 6.75A1.25 1.25 0 015.75 5.5h8.5A1.25 1.25 0 0115.5 6.75v8.5A1.25 1.25 0 0114.25 16.5h-8.5A1.25 1.25 0 014.5 15.25v-8.5zM7 10a1 1 0 011-1h4a1 1 0 110 2H8a1 1 0 01-1-1zm0 3a1 1 0 011-1h4a1 1 0 110 2H8a1 1 0 01-1-1z" clip-rule="evenodd" />
        </symbol>
        <symbol xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" id="icon-close">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </symbol>
    </svg>

    <header class="absolute top-4 left-1/2 -translate-x-1/2 z-20 text-center">
        <h1 class="font-nico-moji font-normal" style="font-size: 25px; letter-spacing: -0.05em;">
            <span class="text-orange-500">REV</span><span class="text-white">ON</span>
        </h1>
        <p class="text-xs font-medium text-gray-400 tracking-widest">CAR RENTALS</p>
    </header>

    <aside class="w-64 sidebar-bg px-6 pb-6 pt-28 flex-none flex flex-col">
        <a href="#" class="flex items-center text-sm text-gray-400 hover:text-gray-200 mb-8">
            <svg class="w-5 h-5"><use href="#icon-chevron-left"></use></svg>
            <span class="ml-1">Pricing Rule Management</span>
        </a>
        
        <nav class="flex flex-col space-y-2">
            <a href="index.html" class="btn-nav w-full text-left px-4 py-3 rounded-lg text-gray-300 hover:bg-slate-700">
                Standard Rates
            </a>
            <a href="create-rule.html" class="btn-nav w-full text-left px-4 py-3 rounded-lg text-gray-300 hover:bg-slate-700 active">
                Dynamic Pricing
            </a>
            <a href="manage-changes.html" class="btn-nav w-full text-left px-4 py-3 rounded-lg text-gray-300 hover:bg-slate-700">
                Additional Charges
            </a>
        </nav>
    </aside>

    <main class="flex-1 h-full overflow-y-auto">
        <div class="content-bg rounded-tl-3xl shadow-xl min-h-full pt-28 px-10 pb-10 relative">
            
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-white">Pricing Rule Management</h1>
                <p class="text-gray-400 mt-1">Manage all pricing rules for the vehicle rental service</p>
            </div>

            <div class="space-y-8">
                <div class="bg-white text-gray-900 rounded-xl shadow-2xl p-6">
                    <h2 class="text-xl font-semibold mb-6">Create New Pricing Rule</h2>
                    <form id="form-dynamic-pricing" class="space-y-6">
                        <input type="hidden" id="dynamic-rule-id">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="rule-name" class="block mb-2 text-sm font-medium text-gray-700">Rule name</label>
                                <input type="text" id="rule-name" class="bg-gray-100 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="e.g., Holiday Season Surcharge" required>
                            </div>
                            <div>
                                <label for="percentage-increase" class="block mb-2 text-sm font-medium text-gray-700">Percentage Increase</label>
                                <div class="relative">
                                    <input type="number" id="percentage-increase" class="bg-gray-100 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="15" required>
                                    <span class="absolute inset-y-0 right-4 flex items-center text-gray-500">%</span>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <label for="date-range" class="block mb-2 text-sm font-medium text-gray-700">Effective Date Range</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <svg class="w-5 h-5 text-gray-500"><use href="#icon-calendar"></use></svg>
                                </div>
                                <input type="text" id="date-range" class="bg-gray-100 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 pl-10" placeholder="Select date range or type rule (e.g., Every Sat, Sun)" required>
                            </div>
                        </div>
                        
                        <div class="text-right space-x-3">
                            <button type="button" id="btn-cancel-dynamic" onclick="cancelEditDynamicRule()" class="btn-cancel-edit bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2.5 px-5 rounded-lg">
                                Cancel
                            </button>
                            <button type="submit" id="btn-save-dynamic-rule" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-5 rounded-lg">
                                Save Rule
                            </button>
                        </div>
                    </form>
                </div>

                <div class="bg-white text-gray-900 rounded-xl shadow-2xl overflow-hidden">
                    <div class="p-6">
                        <h2 class="text-xl font-semibold">Existing Rules</h2>
                    </div>
                    
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rule Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date Range</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Percentage</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-dynamic-pricing" class="divide-y divide-gray-200">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-70 z-40 hidden" onclick="closeModal()"></div>
    <div id="modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-xl shadow-2xl z-50 w-full max-w-lg p-6 hidden text-gray-900">
        <div class="flex justify-between items-center mb-6">
            <h3 id="modal-title" class="text-xl font-semibold">Modal Title</h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-full">
                <svg class="w-6 h-6"><use href="#icon-close"></use></svg>
            </button>
        </div>
        <div id="modal-content">
            </div>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        const state = {
            // standardRates is removed
            dynamicRules: [
                { id: 1, name: 'Holiday Season Surcharge', range: '2025-10-05 - 2025-11-20', percentage: 15 },
                { id: 2, name: 'Weekend Peak', range: 'Every Sat, Sun', percentage: 10 },
                { id: 3, name: 'Summer Discount', range: '2025-06-01 - 2025-08-31', percentage: -5 },
            ],
            // additionalCharges is removed
            editingRuleId: null,
        };

        // Utility to format as currency (not used on this page, but harmless)
        const formatter = new Intl.NumberFormat('en-PH', {
            style: 'currency',
            currency: 'PHP',
        });

        // --- MODAL CONTROLS (COMMON) ---
        const modal = document.getElementById('modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalTitle = document.getElementById('modal-title');
        const modalContent = document.getElementById('modal-content');

        function openModal(title, content) {
            modalTitle.innerText = title;
            modalContent.innerHTML = content;
            modalBackdrop.classList.add('active');
            modalBackdrop.classList.remove('hidden');
            modal.classList.add('active');
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.remove('active');
            modal.classList.add('hidden');
            modalBackdrop.classList.remove('active');
            modalBackdrop.classList.add('hidden');
            modalTitle.innerText = '';
            modalContent.innerHTML = '';
        }

        // --- RENDER FUNCTIONS ---
        // Renders the Dynamic Pricing table
        function renderDynamicRules() {
            const tbody = document.getElementById('tbody-dynamic-pricing');
            tbody.innerHTML = state.dynamicRules.map(rule => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap font-medium">${rule.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-gray-600">${rule.range}</td>
                    <td class="px-6 py-4 whitespace-nowrap ${rule.percentage > 0 ? 'text-green-600' : 'text-red-600'} font-medium">
                        ${rule.percentage > 0 ? '+' : ''}${rule.percentage}%
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium space-x-4">
                        <button class="text-gray-400 hover:text-blue-600" onclick="editDynamicRule(${rule.id})">
                            <svg class="w-5 h-5"><use href="#icon-pencil"></use></svg>
                        </button>
                        <button class="text-gray-400 hover:text-red-600" onclick="confirmDelete(${rule.id})">
                            <svg class="w-5 h-5"><use href="#icon-trash"></use></svg>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // --- STANDARD RATES (REMOVED) ---

        // --- DYNAMIC PRICING (ON-PAGE FORM) ---
        const dynamicForm = document.getElementById('form-dynamic-pricing');
        const dynamicRuleIdInput = document.getElementById('dynamic-rule-id');
        const dynamicRuleNameInput = document.getElementById('rule-name');
        const dynamicPercentageInput = document.getElementById('percentage-increase');
        const dynamicDateRangeInput = document.getElementById('date-range');
        const dynamicSubmitButton = document.getElementById('btn-save-dynamic-rule');
        const dynamicCancelButton = document.getElementById('btn-cancel-dynamic');

        // Handle the "Save Rule" or "Update Rule" submit
        function handleSaveDynamicRule(event) {
            event.preventDefault();
            const id = state.editingRuleId;
            const ruleData = {
                name: dynamicRuleNameInput.value,
                percentage: Number(dynamicPercentageInput.value),
                range: dynamicDateRangeInput.value,
            };

            if (id) {
                // Update
                const index = state.dynamicRules.findIndex(r => r.id === id);
                state.dynamicRules[index] = { ...state.dynamicRules[index], ...ruleData };
            } else {
                // Add new
                ruleData.id = Date.now();
                state.dynamicRules.push(ruleData);
            }
            
            renderDynamicRules();
            cancelEditDynamicRule(); // Resets form
        }

        // Populates the form for editing
        function editDynamicRule(id) {
            const rule = state.dynamicRules.find(r => r.id === id);
            if (!rule) return;

            state.editingRuleId = id;
            dynamicRuleIdInput.value = id;
            dynamicRuleNameInput.value = rule.name;
            dynamicPercentageInput.value = rule.percentage;
            dynamicDateRangeInput.value = rule.range;
            
            dynamicSubmitButton.innerText = 'Update Rule';
            dynamicCancelButton.style.display = 'inline-block';
            dynamicForm.scrollIntoView({ behavior: 'smooth' });
        }

        // Resets the form
        function cancelEditDynamicRule() {
            state.editingRuleId = null;
            dynamicForm.reset();
            dynamicRuleIdInput.value = '';
            dynamicSubmitButton.innerText = 'Save Rule';
            dynamicCancelButton.style.display = 'none';
        }

        // --- ADDITIONAL CHARGES (REMOVED) ---
        // --- SECURITY DEPOSIT (REMOVED) ---

        // --- DELETE FUNCTIONS ---
        // Shows the delete confirmation modal
        function confirmDelete(id) {
            const item = state.dynamicRules.find(i => i.id === id);
            const itemName = item.name;
            const content = `
                <p>Are you sure you want to delete the rule: <strong>${itemName}</strong>?</p>
                <p class="text-sm text-gray-500 mt-1">This action cannot be undone.</p>
                <div class="text-right mt-6 space-x-3">
                    <button onclick="closeModal()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-lg">
                        Cancel
                    </button>
                    <button onclick="deleteItem(${id})" class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded-lg">
                        Delete
                    </button>
                </div>
            `;
            openModal('Confirm Deletion', content);
        }

        // Performs the actual deletion
        function deleteItem(id) {
            state.dynamicRules = state.dynamicRules.filter(i => i.id !== id);
            renderDynamicRules();
            closeModal();
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            // Render the table
            renderDynamicRules();

            // Attach form listeners
            dynamicForm.addEventListener('submit', handleSaveDynamicRule);

            // Initialize Litepicker
            const picker = new Litepicker({
                element: document.getElementById('date-range'),
                singleMode: false,
                format: 'YYYY-MM-DD',
                separator: ' - ',
                tooltipText: { one: 'day', other: 'days' },
                dropdowns: { months: true, years: true },
                setup: (picker) => {
                    picker.on('show', () => {
                        const value = picker.options.element.value;
                        if (value.includes(' - ')) {
                            const [start, end] = value.split(' - ');
                            const startDate = new Date(start);
                            const endDate = new Date(end);
                            if (!isNaN(startDate) && !isNaN(endDate)) {
                                picker.setDateRange(start, end);
                            }
                        }
                    });
                }
            });
        });
    </script>

</body>
</html>
