<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment</title>
  <link rel="stylesheet" href="../shared/css/client.css" />
</head>
<body>
  <div class="container">
    <div class="card header">
      <h1>Choose a payment method</h1>
    </div>

    <div class="card">
      <form>
        <div class="form-field">
          <label class="small">Card Number</label>
          <input class="input" placeholder="1234 5678 9012 3456" />
        </div>
        <div class="form-field">
          <label class="small">Expiry</label>
          <input class="input" placeholder="MM / YY" />
        </div>
        <div class="form-field">
          <label class="small">CVC</label>
          <input class="input" placeholder="CVC" />
        </div>
        <div style="margin-top:12px" class="center"><a class="btn-primary" href="confirmation.html">Pay Now</a></div>
      </form>
    </div>
  </div>
  <script src="../shared/js/main.js"></script>
  <script src="../shared/js/client.js"></script>
</body>
</html>
